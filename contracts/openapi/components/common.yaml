openapi: 3.1.0
info:
  title: Aforo shared components
  version: 0.1.0
  description: Shared schemas, parameters, responses and path items. Referenced with $ref; never copied.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token issued by POST /api/v1/auth/login. Validated only by the Gateway.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
      description: Service-to-service identity (Cloud Run IAM). Also used by Pub/Sub push and Cloud Tasks.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: "sha256=<hex HMAC-SHA256 of the raw body with WEBHOOK_SECRET>"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 generated once per user attempt. A repeat returns the same status and body.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated by the Gateway when absent and propagated everywhere.
      schema: { type: string, format: uuid }
    QueuePass:
      name: X-Queue-Pass
      in: header
      required: false
      description: Opaque pass from the queue. Forwarded and logged, never verified (D-07).
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 in UTC.
      examples: ["2026-10-01T15:00:00Z"]
    Currency:
      type: string
      enum: [COP]
    Cents:
      type: integer
      minimum: 0
      description: Money in integer cents.
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - SALE_NOT_OPEN
        - SOLD_OUT
        - LIMIT_EXCEEDED
        - ACTIVE_RESERVATION_EXISTS
        - RESERVATION_EXPIRED
        - IDEMPOTENCY_CONFLICT
        - VALIDATION_ERROR
        - MALFORMED_REQUEST
        - NOT_FOUND
        - INVALID_SIGNATURE
        - PAYMENT_UNAVAILABLE
        - RATE_LIMITED
        - INTERNAL
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri, examples: ["https://aforo.dev/errors/sold-out"] }
        title: { type: string, examples: ["Not enough availability"] }
        status: { type: integer, examples: [409] }
        code: { $ref: "#/components/schemas/ErrorCode" }
        detail: { type: string, description: For humans only. Clients must not parse it. }
        correlationId: { $ref: "#/components/schemas/Uuid" }
        errors:
          type: array
          description: Field errors, only for VALIDATION_ERROR.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, error] }
    PubSubPushRequest:
      type: object
      description: Body Pub/Sub sends to a push subscription. message.data is the base64 of the event envelope.
      required: [message, subscription]
      properties:
        subscription: { type: string }
        message:
          type: object
          required: [data, messageId]
          properties:
            data: { type: string, contentEncoding: base64 }
            messageId: { type: string }
            publishTime: { $ref: "#/components/schemas/Timestamp" }
            attributes:
              type: object
              properties:
                type: { type: string }
                correlationId: { type: string }

  headers:
    IdempotentReplayed:
      description: |
        Present with value `true` when this response is a replay of a previous request with the
        same Idempotency-Key and body (R-06). Absent on the first execution.
      schema: { type: string, enum: ["true"] }

  responses:
    Unauthenticated:
      description: Missing or expired session token (emitted by the Gateway).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Business-rule conflict. See `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Request does not match the schema.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MalformedRequest:
      description: Request body is not valid JSON.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PushAck:
      description: Message processed (or already processed). Any non-2xx makes Pub/Sub retry.

  pathItems:
    HealthLive:
      get:
        tags: [health]
        summary: Liveness — the process answers
        operationId: healthLive
        security: []
        responses:
          "200":
            description: Alive
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
    HealthReady:
      get:
        tags: [health]
        summary: Readiness — database and dependencies ready
        operationId: healthReady
        security: []
        responses:
          "200":
            description: Ready
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
          "503":
            description: Not ready
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
    Housekeeping:
      post:
        tags: [internal]
        summary: Periodic housekeeping, called every minute by Cloud Scheduler (ADR-0002)
        description: |
          Flushes unpublished outbox rows and runs the service's own sweeps (e.g. Inventory
          expires overdue reservations). Idempotent: calling it twice is harmless.
        operationId: housekeeping
        security: [{ serviceAuth: [] }]
        responses:
          "204": { description: Done }
