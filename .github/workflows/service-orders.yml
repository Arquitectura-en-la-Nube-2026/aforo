name: service-orders

on:
  pull_request:
    paths: ["services/orders/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-orders.yml"]
  push:
    branches: [main]
    paths: ["services/orders/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-orders.yml"]
  workflow_dispatch:

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      service: orders
    permissions:
      contents: read
      id-token: write
