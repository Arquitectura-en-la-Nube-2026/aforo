name: service (reusable)

# Build, test and deploy one Cloud Run service with blue/green (D-19,
# docs/architecture/build-and-deploy.md). Called by the thin service-<name>.yml files.
#
# The deploy job runs only when started by hand (workflow_dispatch) or, on merge to main, when
# the repo variable DEPLOY_ON_MERGE is "true". Off by default to keep main merges free.

on:
  workflow_call:
    inputs:
      service:
        description: Unit folder under services/ and Cloud Run name aforo-<service>
        required: true
        type: string
      folder:
        description: Unit folder (services/<service> unless overridden, e.g. apps/web)
        required: false
        type: string
      smoke_path:
        description: >-
          Path the smoke test expects 200 from on the tag URL. /health/ready by default; queue
          uses /health/live because it answers 503 while Memorystore is off (ADR-0001).
        required: false
        type: string
        default: /health/ready

env:
  PROJECT_ID: aforo-dev-teamf
  REGION: southamerica-east1
  REGISTRY: southamerica-east1-docker.pkg.dev/aforo-dev-teamf/aforo
  WIF_PROVIDER: projects/68220265740/locations/global/workloadIdentityPools/github/providers/aforo-repo
  WIF_SERVICE_ACCOUNT: github-ci@aforo-dev-teamf.iam.gserviceaccount.com
  FOLDER: ${{ inputs.folder || format('services/{0}', inputs.service) }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.unit.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      # A unit that isn't scaffolded yet (no Dockerfile or no root lock file) is skipped, not failed.
      - id: unit
        run: |
          if [ -f "$FOLDER/Dockerfile" ] && [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$FOLDER has no Dockerfile or the repo has no package-lock.json yet; skipping"
          fi
      - if: steps.unit.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.unit.outputs.ready == 'true'
        run: npm ci
      # @aforo/common exposes its types from dist/, so build it before lint and test.
      - if: steps.unit.outputs.ready == 'true'
        run: npm run build --workspace packages/common
      - if: steps.unit.outputs.ready == 'true'
        run: npm run lint --if-present --workspace "$FOLDER"
      - if: steps.unit.outputs.ready == 'true'
        run: npm test --if-present --workspace "$FOLDER"
      - if: steps.unit.outputs.ready == 'true'
        name: Docker build
        run: docker build -f "$FOLDER/Dockerfile" -t "${{ inputs.service }}:ci" .

  deploy:
    needs: check
    if: >-
      needs.check.outputs.ready == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ON_MERGE == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: aforo-${{ inputs.service }}
      IMAGE: southamerica-east1-docker.pkg.dev/aforo-dev-teamf/aforo/${{ inputs.service }}
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      # Immutable artifact: tagged with the full git SHA, deployed by digest. Tags can't be
      # overwritten, so a retry of the same commit reuses the image instead of rebuilding it
      # (builds aren't byte-reproducible, and promotion must reuse the same artifact).
      - name: Build and push (or reuse)
        run: |
          if EXISTING=$(gcloud artifacts docker images describe "$IMAGE:${{ github.sha }}" \
              --format='value(image_summary.digest)' 2>/dev/null) && [ -n "$EXISTING" ]; then
            DIGEST="$IMAGE@$EXISTING"
            echo "Reusing existing image $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
            docker build -f "$FOLDER/Dockerfile" -t "$IMAGE:${{ github.sha }}" .
            docker push "$IMAGE:${{ github.sha }}"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Image: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # Expand-only migrations (build-and-deploy.md) run with the new image before the new revision
      # exists, so it never serves against an older schema. The other jobs of the unit (the catalog
      # seed) get the same image, so `make seed` runs the code that is deployed. Units without a
      # database have no jobs. Needs Cloud SQL on (`make up`), as the smoke test does.
      - name: Migrate with the new image
        run: |
          JOBS=$(gcloud run jobs list --region "$REGION" --format='value(metadata.name)' \
            --filter="metadata.name ~ ^$SERVICE-")
          for JOB in $JOBS; do
            gcloud run jobs update "$JOB" --image "$DIGEST" --region "$REGION" --quiet
          done
          if echo "$JOBS" | grep -qx "$SERVICE-migrate"; then
            gcloud run jobs execute "$SERVICE-migrate" --region "$REGION" --wait
            echo "Migrations applied by $SERVICE-migrate." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Blue/green: new revision with no traffic, reachable only on its tag URL.
      - name: Deploy without traffic
        run: |
          SHORT=${GITHUB_SHA::7}
          gcloud run deploy "$SERVICE" --image "$DIGEST" --region "$REGION" \
            --no-traffic --tag "sha-$SHORT" --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.traffic[].url)' | tr ';' '\n' | grep "sha-$SHORT---" | head -1)
          echo "TAG_URL=$URL" >> "$GITHUB_ENV"
          echo "Tag URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      # gcloud can't mint ID tokens for a Workload Identity login; the auth action can. The
      # audience is the service's custom audience (Terraform), valid on its tag URLs.
      - id: id-token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: aforo-${{ inputs.service }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Smoke test on the tag URL
        env:
          TOKEN: ${{ steps.id-token.outputs.id_token }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$TAG_URL$SMOKE_PATH")
            echo "attempt $i: $CODE"
            [ "$CODE" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::$SMOKE_PATH did not return 200; traffic stays on the previous revision"
          exit 1

      - name: Shift traffic
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          {
            echo "Traffic: 100% to the new revision."
            echo "Rollback: \`gcloud run services update-traffic $SERVICE --region $REGION --to-revisions <previous>=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
