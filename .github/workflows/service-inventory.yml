name: service-inventory

on:
  pull_request:
    paths: ["services/inventory/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-inventory.yml"]
  push:
    branches: [main]
    paths: ["services/inventory/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-inventory.yml"]
  workflow_dispatch:

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      service: inventory
    permissions:
      contents: read
      id-token: write
