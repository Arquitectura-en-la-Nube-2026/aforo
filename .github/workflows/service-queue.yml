name: service-queue

on:
  pull_request:
    paths: ["services/queue/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-queue.yml"]
  push:
    branches: [main]
    paths: ["services/queue/**", "packages/common/**", ".github/workflows/_service.yml", ".github/workflows/service-queue.yml"]
  workflow_dispatch:

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      service: queue
    permissions:
      contents: read
      id-token: write

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@aforo/queue
        env:
          REQUIRE_REDIS: "1"
